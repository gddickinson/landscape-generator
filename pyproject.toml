[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "landscape-generator"
version = "0.1.0"
description = "Procedural terrain generator with biomes, seasons, and Voronoi features"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "matplotlib>=3.4.0",
    "scipy>=1.7.0",
    "opencv-python>=4.5.0",
    "shapely>=1.8.0",
]

[project.scripts]
generate-terrain = "generate:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
